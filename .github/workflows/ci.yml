name: CI

on:
  push:
    branches: [main, "enhancement/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Clean install and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run verify
